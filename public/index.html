<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OGP Checker</title>
<link rel="icon" type="image/svg+xml" href="/lllLogo.svg" />
<link rel="stylesheet" href="/style.css" />
<script>
(function () {
	try {
		var theme = localStorage.getItem("ogp-theme");
		if (theme === "light" || theme === "dark") {
			document.documentElement.dataset.theme = theme;
		}
	} catch (e) {}
})();
</script>
</head>
<body>
<main class="page">
	<header class="header">
		<div class="header-top">
			<div class="brand">
				<img src="/lllLogo.svg" alt="LLL" class="logo" />
				<h1 id="app-title"></h1>
			</div>
			<div class="controls">
				<div class="lang-switch" id="lang-switch">
					<button type="button" data-lang="en">EN</button>
					<button type="button" data-lang="ja">日本語</button>
					<button type="button" data-lang="zh">简体中文</button>
				</div>
				<button type="button" id="theme-toggle" class="theme-toggle"></button>
			</div>
		</div>
		<p id="app-description"></p>
	</header>

	<div class="tabs" role="tablist">
		<button type="button" class="tab-button active" id="tab-url" role="tab" aria-selected="true"></button>
		<button type="button" class="tab-button" id="tab-manual" role="tab" aria-selected="false"></button>
	</div>

	<div id="panel-url" class="tab-panel">
		<form id="check-form" class="check-form">
			<input
				id="url-input"
				type="text"
				inputmode="url"
				autocomplete="off"
				required
			/>
			<button type="submit" id="check-button"></button>
		</form>
	</div>

	<div id="panel-manual" class="tab-panel" hidden>
		<form id="manual-form" class="manual-form">
			<div class="field">
				<label for="manual-title" id="manual-title-label"></label>
				<input id="manual-title" type="text" />
			</div>
			<div class="field">
				<label for="manual-desc" id="manual-desc-label"></label>
				<textarea id="manual-desc" rows="3"></textarea>
			</div>
			<div class="field">
				<label for="manual-site" id="manual-site-label"></label>
				<input id="manual-site" type="text" placeholder="example.com" />
			</div>
			<div class="field">
				<label for="manual-image-url" id="manual-image-url-label"></label>
				<input id="manual-image-url" type="text" placeholder="https://example.com/image.png" />
			</div>
			<div class="field">
				<label for="manual-image-file" id="manual-image-file-label"></label>
				<input id="manual-image-file" type="file" accept="image/*" />
			</div>
			<button type="submit" id="manual-button"></button>
		</form>
	</div>

	<p id="error" class="error" hidden></p>
	<p id="loading" class="loading" hidden></p>

	<section id="results" class="results" hidden>
		<div id="cards" class="cards-grid"></div>

		<div class="card-group">
			<h2 id="raw-tags-heading"></h2>
			<table id="raw-table" class="raw-table">
				<tbody></tbody>
			</table>
		</div>
	</section>
</main>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
